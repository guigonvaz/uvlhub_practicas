name: Mover a 'In progress' con Commit (Refs #N)

on:
  # Se activa en cualquier 'push' a ramas que NO sean main o trunk
  push:
    branches-ignore:
      - main
      - trunk
    paths-ignore:
      - '**.md' # Ignora cambios en archivos de documentación

jobs:
  move_card_to_inprogress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4
      
      # 1. Extraer el Número de la Issue del patrón "Refs #N"
      - name: Obtener Número de Issue por Patrón 'Refs #N'
        id: get_issue_number
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Busca el patrón 'Refs #N' donde N es uno o más dígitos
          ISSUE_NUMBER=$(echo "$COMMIT_MSG" | grep -o -E 'Refs #[0-9]+' | grep -o -E '[0-9]+' | head -1)
          
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::notice::No se encontró el patrón 'Refs #N' en el commit. Saltando acción."
            echo "issue_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Issue a mover: #$ISSUE_NUMBER"
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      # 2. Mover la Tarjeta usando la acción de Marketplace (¡Nueva Acción!)
      - name: Mover Issue a la Columna 'In progress'
        # Sólo se ejecuta si se encontró un número de issue válido
        if: steps.get_issue_number.outputs.issue_number != ''
        uses: satyasooraj/github-project-automation@v2 
        with:
          # --- [VARIABLES DE CONFIGURACIÓN OBLIGATORIAS] ---
          action: 'set-field'                             # Acción: Establecer el valor de un campo
          project-name: 'TEST_PROJECT'                         # <-- [CAMBIAR] Nombre EXACTO de tu proyecto
          field-name: 'In progress'                            # <-- [CAMBIAR] Nombre del campo (columna)
          field-value: 'In progress'                      # <-- [CAMBIAR] Nombre del estado/columna de destino
          github-token: ${{ secrets.PROJECT_PAT }}        # PAT con 'write:project'
          
          # --- [VARIABLES AUTOMÁTICAS] ---
          issue-number: ${{ steps.get_issue_number.outputs.issue_number }}
          owner-type: 'user'                      # <-- [CAMBIAR] O 'user' si es un proyecto personal
          owner-name: ${{ github.repository_owner }}