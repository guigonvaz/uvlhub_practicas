name: Mover a 'In progress' con Commit (GH CLI)

on:
  push:
    branches-ignore:
      - main
      - trunk
    paths-ignore:
      - '**.md'

jobs:
  move_card_to_inprogress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4
      
      # 1. Instalar la CLI de GitHub (gh) y la extensión 'project'
      - name: Instalar GitHub CLI y Extensión 'project' 👈 PASO AÑADIDO
        run: |
          # La CLI 'gh' ya está preinstalada en las VM de GitHub Actions, 
          # pero la extensión 'project' debe instalarse.
          gh extension install github/gh-project
        
      # 2. Extraer el Número de la Issue y configurar IDs
      - name: Configurar Datos del Proyecto e Issue
        id: config_data
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # --- [IDs OBLIGATORIOS (Sustituir con los IDs obtenidos)] ---
          # ¡Asegúrate de haber reemplazado estos valores!
          echo "PROJECT_ID=PVT_kwHOBtICTM4BJYej" >> $GITHUB_ENV
          echo "STATUS_FIELD_ID=PVTSSF_lAHOBtICTM4BJYejzg5kBZI" >> $GITHUB_ENV
          echo "IN_PROGRESS_OPTION_ID=47fc9ee4" >> $GITHUB_ENV
          # -----------------------------------------------------------
          
          # Extraer el patrón 'Refs #N'
          ISSUE_NUMBER=$(echo "$COMMIT_MSG" | grep -o -E 'Refs #[0-9]+' | grep -o -E '[0-9]+' | head -1)
          
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::notice::No se encontró el patrón 'Refs #N'. Saltando."
            echo "issue_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          
      # 3. Mover la Tarjeta usando la CLI de GitHub
      - name: Mover Issue a In Progress (CLI)
        if: steps.config_data.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }} # PAT con 'write:project'
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ISSUE_NUMBER: ${{ steps.config_data.outputs.issue_number }}
          STATUS_FIELD_ID: ${{ env.STATUS_FIELD_ID }}
          IN_PROGRESS_OPTION_ID: ${{ env.IN_PROGRESS_OPTION_ID }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # 1. Añadir la Issue al Proyecto si aún no está
          gh project item-add $PROJECT_ID --issue $ISSUE_NUMBER --owner "$OWNER"
          
          # 2. Obtener el ID del Item del proyecto para la Issue
          ITEM_ID=$(gh project item-list $PROJECT_ID --owner "$OWNER" | grep "#$ISSUE_NUMBER" | awk '{print $1}' | head -1)
          
          if [ -z "$ITEM_ID" ]; then
            echo "Error: No se pudo encontrar el Item ID en el proyecto. ¿Está la Issue #$ISSUE_NUMBER ya añadida al proyecto?"
            exit 1
          fi

          # 3. Actualizar el Campo 'Status' al valor 'In progress'
          echo "Actualizando Item $ITEM_ID en el Project $PROJECT_ID..."
          
          gh project item-edit $PROJECT_ID $ITEM_ID \
             --field-id $STATUS_FIELD_ID \
             --field-value-id $IN_PROGRESS_OPTION_ID \
             --owner "$OWNER"
          
          echo "Movimiento completado para Issue #$ISSUE_NUMBER a 'In progress'."