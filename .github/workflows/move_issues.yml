name: Mover a 'In progress' o 'Done' con Commit (GH CLI)

on:
  push:
    branches-ignore:
      - main
      - trunk
    paths-ignore:
      - '**.md'

jobs:
  move_card_to_status:
    runs-on: ubuntu-latest
    
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }} 
      
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4
      
      # 2. Configurar IDs y Extraer la Issue del Commit
      - name: Configurar Datos del Proyecto, IDs y Status
        id: config_data
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # --- [IDs OBTENIDOS DE GRAPHQL Y LA URL] ---
          echo "PROJECT_ID=PVT_kwHOBtICTM4BJYej" >> $GITHUB_ENV
          echo "PROJECT_NUMBER=1" >> $GITHUB_ENV
          echo "STATUS_FIELD_ID=PVTSSF_lAHOBtICTM4BJYejzg5kBZI" >> $GITHUB_ENV
          
          # IDs de las opciones de Status
          echo "IN_PROGRESS_OPTION_ID=47fc9ee4" >> $GITHUB_ENV
          echo "DONE_OPTION_ID=98236657" >> $GITHUB_ENV 
          # --------------------------------------------------
          
          # 1. Extraer el patrón 'Refs #N' o 'Closes #N' del mensaje de commit
          ISSUE_NUMBER=$(echo "$COMMIT_MSG" | grep -o -E '(Refs|Closes) #[0-9]+' | grep -o -E '[0-9]+' | head -1)
          
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::notice::No se encontró el patrón 'Refs #N' ni 'Closes #N'. Saltando."
            echo "issue_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          
          # 2. Determinar el Status Objetivo (TARGET_STATUS_ID) y asignarlo al entorno
          
          TARGET_STATUS_ID="" # Inicializa
          
          if echo "$COMMIT_MSG" | grep -q "Closes #$ISSUE_NUMBER"; then
              TARGET_STATUS_ID="$DONE_OPTION_ID"
              echo "::notice::Detectado 'Closes #$ISSUE_NUMBER'. Mover a Done."
          elif echo "$COMMIT_MSG" | grep -q "Refs #$ISSUE_NUMBER"; then
              TARGET_STATUS_ID="$IN_PROGRESS_OPTION_ID"
              echo "::notice::Detectado 'Refs #$ISSUE_NUMBER'. Mover a In Progress."
          fi

          if [ -z "$TARGET_STATUS_ID" ]; then
              echo "Error: Se detectó un número de Issue ($ISSUE_NUMBER) pero el patrón (Refs/Closes) no fue reconocido. Asegúrate de que el patrón esté completo en el mensaje."
              exit 1
          fi

          # Exportar la variable TARGET_STATUS_ID
          echo "TARGET_STATUS_ID=$TARGET_STATUS_ID" >> $GITHUB_ENV
          
      # 3. Mover la Tarjeta usando la CLI de GitHub
      - name: Mover Issue al Status Correspondiente (CLI)
        # La condición es redundante aquí ya que el paso anterior verifica y sale, pero lo mantenemos por claridad
        if: steps.config_data.outputs.issue_number != ''
        env:
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }} 
          PROJECT_ID: ${{ env.PROJECT_ID }}         
          ISSUE_NUMBER: ${{ steps.config_data.outputs.issue_number }}
          STATUS_FIELD_ID: ${{ env.STATUS_FIELD_ID }}
          # TARGET_STATUS_ID ya está en el entorno
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }} 
        run: |
          # Construir URL de la Issue
          ISSUE_URL="https://github.com/$OWNER/$REPO_NAME/issues/$ISSUE_NUMBER"
          
          # 1. Añadir la Issue al Proyecto (Si ya existe, el || true lo ignora)
          echo "Añadiendo/Verificando Issue #$ISSUE_NUMBER en el proyecto $PROJECT_NUMBER usando URL: $ISSUE_URL"
          gh project item-add $PROJECT_NUMBER --url "$ISSUE_URL" --owner "$OWNER" || true 
          
          # 2. Obtener el ID del Item del proyecto
          echo "Buscando Item ID para la Issue #$ISSUE_NUMBER..."
          
          ITEM_ID=$(gh api graphql \
            --field query='
              query {
                node(id: "'"$PROJECT_ID"'") {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          __typename
                          ... on Issue {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            --field id="$PROJECT_ID" \
            | jq -r --arg issue_num "$ISSUE_NUMBER" \
                '.data.node.items.nodes[] | 
                 select(.content.__typename == "Issue") | 
                 select(.content.number == ($issue_num | tonumber)) | 
                 .id')

          # 3. Validar el ITEM_ID y continuar
          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" == "null" ]; then
            echo "Error: No se pudo encontrar el Item ID. Asegúrate de que la Issue #$ISSUE_NUMBER esté en el proyecto."
            exit 1
          fi

          # 4. Actualizar el Campo 'Status'
          echo "Item ID encontrado: $ITEM_ID"
          echo "Actualizando Item $ITEM_ID en el Project $PROJECT_ID con Status ID: $TARGET_STATUS_ID..."
          
          gh project item-edit \
             --project-id $PROJECT_ID \
             --id $ITEM_ID \
             --field-id $STATUS_FIELD_ID \
             --single-select-option-id $TARGET_STATUS_ID
          
          echo "Movimiento completado para Issue #$ISSUE_NUMBER."