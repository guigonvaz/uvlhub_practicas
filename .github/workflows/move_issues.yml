name: Mover a 'In progress' con Commit (GH CLI)

on:
  # Se activa en cualquier 'push' a ramas que NO sean main o trunk
  push:
    branches-ignore:
      - main
      - trunk
    paths-ignore:
      - '**.md'

jobs:
  move_card_to_inprogress:
    runs-on: ubuntu-latest
    
    # 1. Configuración del Token para la CLI (GH_TOKEN)
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }} 
      
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4
      
      # 2. Configurar IDs y Extraer la Issue del Commit
      - name: Configurar Datos del Proyecto e Issue
        id: config_data
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # --- [IDs OBTENIDOS DE GRAPHQL Y LA URL] ---
          echo "PROJECT_ID=PVT_kwHOBtICTM4BJYej" >> $GITHUB_ENV
          echo "PROJECT_NUMBER=1" >> $GITHUB_ENV
          echo "STATUS_FIELD_ID=PVTSSF_lAHOBtICTM4BJYejzg5kBZI" >> $GITHUB_ENV
          echo "IN_PROGRESS_OPTION_ID=47fc9ee4" >> $GITHUB_ENV
          # --------------------------------------------------
          
          # Extraer el patrón 'Refs #N' del mensaje de commit
          ISSUE_NUMBER=$(echo "$COMMIT_MSG" | grep -o -E 'Refs #[0-9]+' | grep -o -E '[0-9]+' | head -1)
          
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::notice::No se encontró el patrón 'Refs #N'. Saltando."
            echo "issue_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          
      # 3. Mover la Tarjeta usando la CLI de GitHub
      - name: Mover Issue a In Progress (CLI)
        if: steps.config_data.outputs.issue_number != ''
        env:
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          ISSUE_NUMBER: ${{ steps.config_data.outputs.issue_number }}
          STATUS_FIELD_ID: ${{ env.STATUS_FIELD_ID }}
          IN_PROGRESS_OPTION_ID: ${{ env.IN_PROGRESS_OPTION_ID }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }} 
        run: |
          # Construir URL de la Issue
          ISSUE_URL="https://github.com/$OWNER/$REPO_NAME/issues/$ISSUE_NUMBER"
          
          # 1. Añadir la Issue al Proyecto (Usa PROJECT_NUMBER como argumento posicional)
          echo "Añadiendo Issue #$ISSUE_NUMBER al proyecto $PROJECT_NUMBER usando URL: $ISSUE_URL"
          # Usamos || true para que el workflow no falle si la Issue ya existe en el proyecto
          gh project item-add $PROJECT_NUMBER --url "$ISSUE_URL" --owner "$OWNER" || true 
          
          # 2. Obtener el ID del Item del proyecto (¡MÉTODO CORREGIDO Y ROBUSTO!)
          echo "Buscando Item ID para la Issue #$ISSUE_NUMBER..."
          
          # Usamos GraphQL para buscar el item en el proyecto basado en el número de Issue.
          ITEM_ID=$(gh api graphql --jq '.node.items.nodes[0].id' -f query="
            query {
              node(id: \"$PROJECT_ID\") {
                ... on ProjectV2 {
                  items(first: 100, types: ISSUE) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          number
                        }
                      }
                    }
                  }
                }
              }
            }
          " | jq -r --arg num "$ISSUE_NUMBER" '.[] | select(.content.number == ($num | tonumber)) | .id')

          # 3. Validar el ITEM_ID y continuar
          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" == "null" ]; then
            echo "Error: No se pudo encontrar el Item ID. La Issue #$ISSUE_NUMBER no está vinculada al proyecto."
            exit 1
          fi

          # 4. Actualizar el Campo 'Status' (Usa PROJECT_NUMBER)
          echo "Item ID encontrado: $ITEM_ID"
          echo "Actualizando Item $ITEM_ID en el Project $PROJECT_NUMBER..."
          
          gh project item-edit $PROJECT_NUMBER $ITEM_ID \
             --field-id $STATUS_FIELD_ID \
             --field-value-id $IN_PROGRESS_OPTION_ID \
             --owner "$OWNER"
          
          echo "Movimiento completado para Issue #$ISSUE_NUMBER a 'In Progress'."